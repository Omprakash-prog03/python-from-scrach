name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: 'pip'

      - name: Show Python info
        shell: pwsh
        run: |
          python --version
          where.exe python
          Get-Location
          Get-ChildItem platesense -Name | Select-Object -First 20

      - name: Install CPU-only PyTorch first
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install PlateSense dependencies
        shell: pwsh
        working-directory: platesense
        run: pip install -r requirements-dev.txt

      - name: Verify imports
        shell: pwsh
        working-directory: platesense
        run: python -c "import PySide6, cv2, numpy, PIL, easyocr, shapely, skimage, scipy, torch, torchvision, PyInstaller; print('imports OK')"

      - name: Smoke-run PyInstaller help
        shell: pwsh
        working-directory: platesense
        run: python -m PyInstaller --version

      - name: Build with PyInstaller
        shell: pwsh
        working-directory: platesense
        run: python -m PyInstaller PlateSense.spec --clean --noconfirm --log-level INFO

      - name: Verify exe
        shell: pwsh
        working-directory: platesense
        run: |
          $exe = "dist\PlateSense\PlateSense.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "ERROR: $exe not found. dist listing:"
            Get-ChildItem -Recurse dist | Select-Object FullName, Length
            exit 1
          }
          Write-Host "exe OK: $((Get-Item $exe).Length/1MB) MB"
          Get-ChildItem dist\PlateSense | Measure-Object -Property Length -Sum | ForEach-Object {
            Write-Host "Total dist: $([math]::Round($_.Sum/1MB,1)) MB ($($_.Count) files)"
          }

      - name: Package as zip
        id: pkg
        shell: pwsh
        working-directory: platesense
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $zip = "PlateSense-$version-win-x64.zip"
          Compress-Archive -Path "dist\PlateSense\*" -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Zip: $((Get-Item $zip).Length) bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlateSense-windows-x64
          path: platesense/PlateSense-*-win-x64.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: platesense/PlateSense-*-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## PlateSense ${{ github.ref_name }} — Windows (x64)

            **Download:** `PlateSense-${{ github.ref_name }}-win-x64.zip`

            ### Install (recommended)
            ```powershell
            irm https://raw.githubusercontent.com/Omprakash-prog03/python-from-scrach/main/platesense/scripts/install.ps1 | iex
            ```
            Add `-Launch` to start the app after installing.

            ### Manual install
            Download the zip, right-click → Properties → Unblock → OK, extract and double-click `PlateSense.exe`.

            > First run downloads EasyOCR's English model (~60 MB); afterwards fully offline.
