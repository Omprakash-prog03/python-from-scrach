name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: 'pip'

      - name: Install CPU-only PyTorch first (avoids huge CUDA wheel)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install PlateSense runtime + build dependencies
        working-directory: platesense
        run: pip install -r requirements-dev.txt

      - name: Verify imports
        working-directory: platesense
        run: python -c "import PySide6, cv2, numpy, PIL, easyocr, shapely, skimage, scipy, torch, torchvision, PyInstaller; print('imports OK')"

      - name: Build with PyInstaller
        working-directory: platesense
        shell: cmd
        run: |
          python -m PyInstaller PlateSense.spec --clean --noconfirm --log-level INFO > build.log 2>&1
          set EC=%ERRORLEVEL%
          echo.
          echo ============ build.log tail ============
          powershell -NoProfile -Command "Get-Content build.log -Tail 200"
          echo ========================================
          exit /b %EC%

      - name: Verify the exe exists
        working-directory: platesense
        shell: pwsh
        run: |
          $exe = "dist\PlateSense\PlateSense.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "ERROR: $exe not found. dist/ listing:"
            Get-ChildItem -Recurse dist | Select-Object FullName, Length
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "Built exe: $($size/1MB) MB"
          Get-ChildItem dist\PlateSense | Measure-Object -Property Length -Sum | ForEach-Object {
            Write-Host "Total dist size: $([math]::Round($_.Sum/1MB,1)) MB in $($_.Count) files"
          }

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-log
          path: platesense/build.log
          if-no-files-found: ignore

      - name: Package as zip
        id: pkg
        shell: pwsh
        working-directory: platesense
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $zip = "PlateSense-$version-win-x64.zip"
          Compress-Archive -Path "dist\PlateSense\*" -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Zip: $((Get-Item $zip).Length) bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlateSense-windows-x64
          path: platesense/PlateSense-*-win-x64.zip
          if-no-files-found: error

      - name: Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: platesense/PlateSense-*-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## PlateSense ${{ github.ref_name }} — Windows (x64)

            **Download:** `PlateSense-${{ github.ref_name }}-win-x64.zip`

            ### Option 1 — One-line PowerShell install (recommended)
            ```powershell
            irm https://raw.githubusercontent.com/Omprakash-prog03/python-from-scrach/main/platesense/scripts/install.ps1 | iex
            ```
            Installs to `%LOCALAPPDATA%\PlateSense`, creates Desktop + Start Menu shortcuts (with Uninstall entry). Add `-Launch` to start the app immediately.

            ### Option 2 — Manual zip
            1. Download the zip below
            2. Right-click → **Properties** → tick **Unblock** → OK
            3. Extract anywhere and double-click `PlateSense.exe`

            ### Option 3 — From source
            See the repo README.

            > First run downloads EasyOCR's English model (~60 MB); afterwards fully offline.
