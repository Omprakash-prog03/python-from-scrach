name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: 'pip'

      - name: Show Python info
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          Get-Location
          Get-ChildItem platesense

      - name: Install dependencies
        shell: pwsh
        working-directory: platesense
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          # Quick sanity import before PyInstaller
          python -c "import PySide6, cv2, numpy, PIL, easyocr, shapely, skimage, scipy, torch, torchvision; print('imports OK')"

      - name: Build with PyInstaller
        shell: cmd
        working-directory: platesense
        run: |
          pyinstaller PlateSense.spec --clean --noconfirm --log-level INFO > build.log 2>&1
          set EC=%ERRORLEVEL%
          echo.
          echo ========== last 80 lines of build.log ==========
          powershell -NoProfile -Command "Get-Content build.log -Tail 80"
          echo ===============================================
          exit /b %EC%

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-build-log
          path: platesense/build.log
          if-no-files-found: ignore

      - name: Package as zip
        id: pkg
        shell: pwsh
        working-directory: platesense
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $zip = "PlateSense-$version-win-x64.zip"
          Compress-Archive -Path "dist\PlateSense\*" -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $size = (Get-Item $zip).Length
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "Built $size bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlateSense-windows-x64
          path: platesense/PlateSense-*-win-x64.zip
          if-no-files-found: error

      - name: Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: platesense/PlateSense-*-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## PlateSense ${{ github.ref_name }} — Windows (x64)

            **Download:** `PlateSense-${{ github.ref_name }}-win-x64.zip` (asset below)

            ### Option 1 — One-line PowerShell install (recommended)

            Open PowerShell and paste:
            ```powershell
            irm https://raw.githubusercontent.com/Omprakash-prog03/python-from-scrach/main/platesense/scripts/install.ps1 | iex
            ```
            The script downloads this release, installs to `%LOCALAPPDATA%\PlateSense`, creates Desktop + Start Menu shortcuts (with Uninstall), and launches the app if you add `-Launch`.

            ### Option 2 — Manual zip
            1. Download `PlateSense-${{ github.ref_name }}-win-x64.zip` below
            2. Right-click → **Properties** → tick **Unblock** → OK
            3. Extract the zip to any folder (e.g. `C:\Program Files\PlateSense`)
            4. Double-click `PlateSense.exe`

            ### Option 3 — Run from source
            See [README.md](https://github.com/Omprakash-prog03/python-from-scrach#readme).

            > **First run:** EasyOCR downloads its English model (~60 MB) on first launch. Subsequent launches are fully offline.
