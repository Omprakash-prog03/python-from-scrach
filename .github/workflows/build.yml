name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies
        working-directory: platesense
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        working-directory: platesense
        run: |
          pyinstaller PlateSense.spec --clean --noconfirm

      - name: Package as zip
        shell: pwsh
        run: |
          cd platesense
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          Compress-Archive -Path "dist\PlateSense\*" -DestinationPath "PlateSense-$version-win-x64.zip" -Force
          echo "zip=platesense/PlateSense-$version-win-x64.zip" >> $env:GITHUB_OUTPUT
        id: pkg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlateSense-windows-x64
          path: platesense/PlateSense-*-win-x64.zip

      - name: Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: platesense/PlateSense-*-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## PlateSense ${{ github.ref_name }} — Windows

            **Download:** `PlateSense-${{ github.ref_name }}-win-x64.zip`

            ### Option 1 — One-line PowerShell install (recommended)
            ```powershell
            irm https://platesense.app/install.ps1 | iex
            ```
            *(Or run the script from this repo: `scripts/install.ps1`)*

            ### Option 2 — Manual zip
            1. Download the zip below
            2. Right-click → Properties → tick "Unblock" → OK
            3. Extract to a folder (e.g. `C:\Program Files\PlateSense`)
            4. Double-click `PlateSense.exe` to launch

            ### Option 3 — Build from source
            See [README.md](https://github.com/Omprakash-prog03/python-from-scrach#packaging--deployment).
